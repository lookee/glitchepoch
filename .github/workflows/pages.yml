name: Publish live demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an active Pages deployment finish before starting the next one.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build demo with first Git commit timestamp
        run: python3 scripts/build_demo.py --output site --require-git
      - uses: actions/configure-pages@v6
      # A re-run keeps artifacts from earlier attempts in the same workflow run.
      # Give each attempt its own artifact name to avoid ambiguous deployments.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
