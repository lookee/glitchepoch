name: Quality checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l glitchepoch.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/glitchepoch.js
          node --check docs/demo.js
      - name: PHP smoke tests
        run: php tests/smoke.php
      - name: JavaScript behavior tests
        run: node --test tests/counter.test.cjs
      - name: Demo Git history test
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Package installable plugin
        run: python3 scripts/package_plugin.py --output dist/glitchepoch.zip
      - name: Verify plugin archive
        run: unzip -t dist/glitchepoch.zip
      - uses: actions/upload-artifact@v7
        with:
          name: glitchepoch-wordpress-plugin
          path: dist/glitchepoch.zip
