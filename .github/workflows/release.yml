name: Publish WordPress ZIP
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          php -l glitchepoch.php
          node --check assets/js/glitchepoch.js
          php tests/smoke.php
      - name: Build installable ZIP
        run: python3 scripts/package_plugin.py --output dist/glitchepoch.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/glitchepoch.zip --generate-notes --verify-tag
